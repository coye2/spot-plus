name: SpotPlus
options:
  bundleIdPrefix: io.github.coye2
  deploymentTarget:
    iOS: "16.0"
targets:
  SpotPlus:
    type: application
    platform: iOS
    sources: [SpotPlus]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.coye2.spotplus
        PRODUCT_NAME: SpotPlus
        PRODUCT_MODULE_NAME: SpotPlus
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: SpotPlus/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
  SpotPlusTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SpotPlusTests]
    dependencies:
      - target: SpotPlus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.coye2.spotplus.tests
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  SpotPlus:
    build:
      targets:
        SpotPlus: all
        SpotPlusTests: [test]
    test:
      targets: [SpotPlusTests]
