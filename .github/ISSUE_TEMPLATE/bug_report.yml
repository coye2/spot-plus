name: Bug report
description: Something in Spot+ isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 16 · Safari · Home Screen app
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recording
      description: Drag images or videos here if it's visual.
