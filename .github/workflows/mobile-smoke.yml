name: 390x844 Mobile Browser Smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium
      - run: node scripts/smoke-mobile.mjs
