name: Build the iPhone app

on:
  push:
    branches: [main]
    paths: ['ios-app/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Create the Xcode project
        working-directory: ios-app
        run: xcodegen generate
      - name: Prove InstantPlay in the iPhone Simulator (no taps)
        working-directory: ios-app
        timeout-minutes: 25
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $SIM"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          set +e
          xcodebuild test -project SpotPlus.xcodeproj -scheme SpotPlus -destination "id=$SIM" \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 300 \
            > test.log 2>&1
          STATUS=$?
          grep -E "APP CONFIG|SAFARI RULES|SONG |Test Case|error:|XCTAssert|TEST (SUCCEEDED|FAILED)" test.log | head -80
          exit $STATUS
      - name: Test log
        if: always()
        working-directory: ios-app
        run: tail -120 test.log || true
      - name: Build (unsigned; Sideloadly or AltStore signs it on install)
        working-directory: ios-app
        run: |
          xcodebuild -project SpotPlus.xcodeproj -scheme SpotPlus -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package SpotPlus.ipa
        working-directory: ios-app
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry SpotPlus.ipa Payload
          ls -lh SpotPlus.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: SpotPlus-ipa
          path: ios-app/SpotPlus.ipa
      - name: Publish the iOS app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-latest ios-app/SpotPlus.ipa --title "Spot+ for iPhone (latest)" \
            --notes "Install with Sideloadly or AltStore. Plays songs instantly with no extra tap and keeps playing in the background. Built from ${GITHUB_SHA::7}." --latest=false
