name: Deploy the Spot+ bridge (Cloudflare worker)
# Deploys canvas-bridge/ whenever it changes, so nobody runs wrangler by hand.
# One-time setup: add repository secrets CLOUDFLARE_API_TOKEN (template
# "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID. Without them this job skips.
on:
  push:
    branches: [main]
    paths: ['canvas-bridge/**', '.github/workflows/worker.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-worker
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip when Cloudflare isn't connected yet
        if: env.HAS_TOKEN != 'true'
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable automatic deploys."
      - uses: actions/setup-node@v6
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 24
      - name: Deploy bridge with trimmed Cloudflare credentials
        if: env.HAS_TOKEN == 'true'
        working-directory: canvas-bridge
        env:
          # Trim whitespace / accidental "Bearer " so wrangler gets a raw API token.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Clean secrets in Python so CI log redaction cannot corrupt shell sed scripts.
          eval "$(python3 - <<'PY'
          import os, shlex
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          token = token.replace("\r", "").replace("\n", "").strip()
          if token.lower().startswith("bearer "):
              token = token[7:].strip()
          account = account.replace("\r", "").replace("\n", "").strip()
          print("export CLOUDFLARE_API_TOKEN=" + shlex.quote(token))
          print("export CLOUDFLARE_ACCOUNT_ID=" + shlex.quote(account))
          PY
          )"
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN is empty after trimming."
            exit 1
          fi
          # Account id is often missing from secrets; resolve it from the token.
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID secret is empty — looking it up from the API token…"
            CLOUDFLARE_ACCOUNT_ID="$(python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              "https://api.cloudflare.com/client/v4/accounts",
              headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.load(response)
          if not data.get("success") or not data.get("result"):
              raise SystemExit("Cloudflare token could not list accounts: " + json.dumps(data)[:400])
          print(data["result"][0]["id"])
          PY
          )"
            export CLOUDFLARE_ACCOUNT_ID
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Could not determine Cloudflare account id."
            exit 1
          fi
          echo "Deploying to Cloudflare account ${CLOUDFLARE_ACCOUNT_ID:0:6}…"
          npx --yes wrangler@4.162.0 deploy
      - name: Check the deployed bridge
        if: env.HAS_TOKEN == 'true'
        run: |
          sleep 5
          curl -fsS https://spot-plus-canvas.pwr97pnmkn.workers.dev/health | tee /tmp/health.json
          python3 - <<'PY'
          import json
          health=json.load(open('/tmp/health.json'))
          assert health.get('status')=='ok', health
          assert health.get('stream') is True, health
          print('bridge health ok:', health)
          PY
          # Smoke InstantPlay stream resolve for a known public recording.
          code=$(curl -sS -o /tmp/stream.json -w '%{http_code}' 'https://spot-plus-canvas.pwr97pnmkn.workers.dev/stream?id=MxEjnYdfLXU&aac=1')
          echo "stream HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Stream probe failed:"; head -c 400 /tmp/stream.json; echo; exit 1
          fi
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/stream.json'))
          assert data.get('url','').startswith('https://'), data
          assert data.get('fast') is True, data
          print('stream ok:', data.get('mime'), data.get('itag'), data['url'][:80])
          PY
